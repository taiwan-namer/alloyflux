  const script = document.createElement('script');

  const opts = {
    language: 'javascript',
    type: 'text/javascript',
    ...options
  };

  Object.keys(opts).forEach((key) => {
    if (key === 'data') {

          script.setAttribute(`data-${dataKey}`, data[dataKey]);
        }
